<html>
<head>

<style>
/* Load Lexend */
@font-face {
    font-family: "Lexend";
    src: url("{{LEXEND_PATH}}");
}

body {
    font-family: "Lexend";
    font-size: 28px;
    line-height: 1.55;
    padding: 20px;
    margin: 0;
    background: #ffffff;
    color: #000000;
}

/* Basic Markdown formatting */
h1, h2, h3, h4 {
    font-weight: 600;
    margin-top: 1.2em;
}
p {
    margin: 0.6em 0;
}
ul, ol {
    padding-left: 40px;
    margin: 0.8em 0;
}
blockquote {
    border-left: 6px solid #bbb;
    padding-left: 20px;
    color: #555;
}
code {
    background: #f2f2f2;
    padding: 3px 6px;
    border-radius: 6px;
}
pre {
    background: #f2f2f2;
    padding: 14px;
    border-radius: 6px;
    overflow-x: auto;
}

/* Tables */
table {
    border-collapse: collapse;
    margin: 1em 0;
    width: 100%;
}
th, td {
    border: 2px solid #aaa;
    padding: 10px 15px;
}

</style>
</head>

<body>
{{MARKDOWN_HTML}}

</body>
</html>
